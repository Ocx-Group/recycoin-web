# Flujo GitOps:
#   1. Build y publicacion de una imagen inmutable.
#   2. El app-of-apps central conserva la Application de ArgoCD.
#   3. Image Updater promueve el tag y ArgoCD sincroniza.
#   4. La verificacion se realiza por endpoints publicos, sin acceso a pods.
# =============================================================================
# Deploy Production
# Trigger: push a 'main' o tag vX.Y.Z (o manual via workflow_dispatch)
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: prod-deploy-recycoin-web
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/ocx-registry
  IMAGE_NAME: recycoin-web

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Compute image tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building production with tag: $VERSION"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 3600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push recycoin-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  release:
    name: Publish Image Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ needs.build-and-push.outputs.version }}"
          body: |
            ## Deploy Production - ${{ needs.build-and-push.outputs.version }}

            **Commit:** ${{ github.sha }}
            **Published by:** ${{ github.actor }}
            **Trigger:** ${{ github.event_name }}

            ### Image pushed to DOCR
            - `recycoin-web:${{ needs.build-and-push.outputs.version }}`

            El app-of-apps central conserva la Application. ArgoCD Image Updater
            promueve la imagen y ArgoCD sincroniza sin acceso directo del pipeline
            a deployments o pods. La disponibilidad se verifica por endpoints
            publicos.
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
